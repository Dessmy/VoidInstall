<!DOCTYPE html>
<html>

<head>
  <title>Homepage</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    html, body {
      background-color: #1a1b26;
      margin: 0;
      height: 100%;
      overflow: hidden;
    }
    ::-webkit-scrollbar {
      display: none;
    }
    a, p, span {
      font-family: "FiraCode Nerd Font";
      font-size: 32px;
      text-align: center;
      color: #f7768e;
      line-height: 1.35;
      margin-top: 0;
      margin-bottom: 0;
      text-decoration: none;
    }
    a:hover {
      color: #7aa2f7;
    }
    .search {
      color: #e0af68;
      font-weight: bold;
    }
    .search:hover {
      background-color: #e0af68;
    }

    div {
      margin: auto;
      width: 50%;
      text-align: center;
    }
    .logo {
      max-width: 420px;
      width: 60%;
      height: auto;
    }
    .links {
      margin-top: 60px;
    }
    .links a, .links span {
      margin: 0 15px;
      font-size: 72px;
    }
  </style>
</head>

<body>
  <br><br><br>
  <div class="icon">
    <img class="logo" src="logo.png" alt="qb">
  </div>
  <br><br>
  <div class="links">
    <span class="search">[o] Search</span>
  </div>
</body>

</html>
